<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      a {
        color: white;
        text-decoration: none;
      }
      nav {
        width: 700px;
        height: 30px;
        display: flex;
        div {
          background-color: blue;
          width: 25%;
          height: 100%;
          display: flex;
          justify-content: center;
          align-items: center;

          border-right: 1px solid white;
        }
        div:hover {
          background-color: red;
        }
      }
      .thegioi {
        background-color: white;
        width: 500px;
        height: 30px;
        ul {
          display: inline-flex;
          padding: 0;
          width: 100%;
          height: 100%;
          gap: 1px;
          margin: 0;
          list-style: none;
          li {
            width: 30%;
            background-color: red;
            display: flex;
            text-align: center;
            align-items: center;
            justify-content: center;
          }
        }
      }
    </style>
    <title>Document</title>
  </head>
  <body>
    <nav>
      <div><a href="#">Chính trị-xã hội</a></div>
      <div><a href="#">Thế giới</a></div>
      <div><a href="#">Nhịp sống trẻ</a></div>
      <div><a href="#">Giáo dục</a></div>
      <div><a href="#">Kinh tế</a></div>
    </nav>
    <div class="thegioi">
      <ul>
        <li><a href="#">Thư viện pháp luật</a></li>
        <li><a href="#">Sống khoẻ</a></li>
        <li><a href="">Pháp luật</a></li>
      </ul>
    </div>
  </body>
</html>
