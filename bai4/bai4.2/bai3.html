<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      nav {
        width: 700px;
        height: 30px;
        display: flex;
        div {
          background-color: blue;
          width: 25%;
          height: 100%;
          display: flex;
          justify-content: center;
          align-items: center;

          border-right: 1px solid white;
        }
        a {
          color: white;
          text-decoration: none;
        }
        div:hover {
          background-color: red;
        }
        .thegioi {
          ul {
            list-style: none;
          }
        }
      }
    </style>
    <title>Document</title>
  </head>
  <body>
    <nav>
      <div><a href="#">Chính trị-xã hội</a></div>
      <div><a href="#">Thế giới</a></div>
      <div><a href="#">Nhịp sống trẻ</a></div>
      <div><a href="#">Giáo dục</a></div>
      <div><a href="#">Kinh tế</a></div>
    </nav>
    <div class="thegioi">
      <ul>
        <li>Thư viện pháp luật</li>
        <li>Sống khoẻ</li>
        <li>Pháp luật</li>
      </ul>
    </div>
  </body>
</html>
