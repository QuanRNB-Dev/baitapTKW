<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <form style="width: 300px; height: 150px; border: 1px solid black">
      <h2>ĐĂNG NHẬP DIỄN ĐÀN</h2>
      <label for="name">Tên đăng nhập:</label>
      <input type="text" name="name" id="name" placeholder="Tên đăng nhập" />
      <br />
      <label for="password">Mật khẩu:</label>
      <input
        type="password"
        name="password"
        id="password"
        placeholder="Nhập mật khẩu"
      />
      <br />
      <div style="display: flex; flex-direction: row; gap:20px; align-items: center; justify-content:center; margin-top: 10px;">
        <button id="login" name="login">Đăng nhập</button>
        <button>Phục hồi</button>
      </div>
    </form>
  </body>
</html>
