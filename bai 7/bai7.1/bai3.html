
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài tập 3 - Bật tắt bóng đèn</title>
</head>
<body>

    <h3>Bật tắt bóng đèn</h3>

    <img id="bongDen"
         src="dentat.png"
         width="150"
         onclick="batTatDen()">

    <script>
        var trangThai = false;

        function batTatDen() {
            if (trangThai == false) {
                document.getElementById("bongDen").src = "denbat.png";
                trangThai = true;
            } else {
                document.getElementById("bongDen").src = "dentat.png";
                trangThai = false;
            }
        }
    </script>

</body>
</html>
