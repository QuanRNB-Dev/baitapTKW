<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Sap xep</h1>
    <p>Nhap cac phan tu trong mang</p>
    <input id="dulieu" type="text" />
    <br />
    <button onclick="sort()">Nhap</button>
    <br />
    <input type="text" id="ketqua" />
  </body>
  <script>
    function sort() {
      var dulieu = document.getElementById("dulieu").value;
      var ketqua = document.getElementById("ketqua");
      let mang = dulieu.split(" ").map(Number);
      for (var i = 0; i < mang.length - 1; i++) {
        for (var j = 0; j < mang.length - 1 - i; j++) {
          if (mang[j] < mang[j + 1]) {
            var tg = mang[j];
            mang[j] = mang[j + 1];
            mang[j + 1] = tg;
          }
        }
      }
      ketqua.value = mang.join(" ");
    }
  </script>
</html>
