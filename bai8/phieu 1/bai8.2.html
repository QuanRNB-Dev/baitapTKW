<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Đếm giá trị xuất hiện nhiều nhất</title>

    <script>
      function search() {
        var dulieu = document.getElementById("mang").value.trim();
        var display = document.getElementById("display");

        // Kiểm tra dữ liệu đầu vào
        if (dulieu == "") {
          display.innerHTML = "Vui lòng nhập mảng!";
          return;
        }

        var arr1 = dulieu.split(" ");

        // Chuyển đổi kiểu dữ liệu
        for (var i = 0; i < arr1.length; i++) {
          if (!isNaN(arr1[i]) && arr1[i] != "") {
            arr1[i] = Number(arr1[i]);
          } else {
            arr1[i] = String(arr1[i]);
          }
        }

        var a2 = [];
        var a3 = [];

        // Bước 1: Tìm các phần tử khác nhau
        a3[0] = arr1[0];

        var k = 0;

        for (var i = 1; i < arr1.length; i++) {
          var flag = false;

          for (var j = 0; j < a3.length; j++) {
            if (arr1[i] == a3[j]) {
              flag = true;
              break;
            }
          }

          if (flag == false) {
            k++;
            a3[k] = arr1[i];
          }
        }

        // Bước 2: Đếm số lần xuất hiện
        for (var i = 0; i < a3.length; i++) {
          var count = 0;

          for (var j = 0; j < arr1.length; j++) {
            if (a3[i] == arr1[j]) {
              count++;
            }
          }

          a2[i] = count;
        }

        // Bước 3: Tìm số lần xuất hiện lớn nhất
        var max = a2[0];
        var vt = 0;

        for (var i = 1; i < a2.length; i++) {
          if (a2[i] > max) {
            max = a2[i];
            vt = i;
          }
        }

        display.innerHTML = `<p>Phần tử xuất hiện nhiều nhất: ${a3[vt]}
                <br>Số lần xuất hiện: ${max}</p>`;
      }
    </script>
  </head>

  <body>
    <h1>Đếm giá trị trong mảng xuất hiện nhiều nhất</h1>

    <p>Mảng:</p>
    <input type="text" id="mang" />

    <button onclick="search()">Tìm</button>

    <div id="display">Kết quả</div>
  </body>
</html>
